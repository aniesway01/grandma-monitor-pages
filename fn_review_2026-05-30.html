<!doctype html><html lang=zh-Hant><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>FN 漏報確認 2026-05-30</title>
<style>
body{margin:0;background:#111;color:#eee;font:14px/1.5 system-ui,sans-serif}
header{padding:12px 16px;background:#1c1c22;position:sticky;top:0;z-index:5}
header b{color:#ffc13b}.sub{color:#9aa;font-size:12px}
.grid{display:flex;flex-direction:column;gap:14px;padding:14px;max-width:560px;margin:0 auto}
.card{background:#1a1a20;border-radius:10px;overflow:hidden;border:1px solid #2a2a33}
.card.done{opacity:.45;border-color:#2e7d32}
.frame{position:relative;width:100%;background:#000;aspect-ratio:16/9}
.frame img{width:100%;height:100%;object-fit:contain;display:block}
.box{position:absolute;border:2px solid #ff3b3b;box-shadow:0 0 0 9999px rgba(0,0,0,.35);border-radius:2px}
.cap{padding:8px 12px;font-size:13px}
.cap .c{color:#ffc13b;font-weight:600}
.vote{font-size:12px;color:#8fd;}.vote.weak{color:#fc8}
button{width:100%;padding:11px;border:0;font-size:15px;font-weight:600;cursor:pointer;
  background:#2e7d32;color:#fff}button:disabled{background:#444;cursor:default}
.empty{text-align:center;color:#9aa;padding:40px}
.weakwrap{max-width:560px;margin:0 auto 24px}
.weakwrap>summary{cursor:pointer;color:#fc8;padding:10px 14px;font-size:13px;list-style:none}
.weakwrap>summary::-webkit-details-marker{display:none}
</style>
<header><b>FN 漏報確認</b> · 2026-05-30 <span class=sub>兩個多模態都認為是「被誤壓的真人」才上主榜,你確認真的 → 永不再壓。標多標少都行。</span></header>
<div class=grid id=grid></div>
<details class=weakwrap id=weakwrap><summary id=weaksum>弱候選</summary><div class=grid id=weak></div></details>
<script>
var SINK='https://labels.proxyforanding.xyz';
function confirmReal(btn){
  var c=btn.closest('.card');
  var lbl={id:c.dataset.id,box:0,cls:'person',conf:parseFloat(c.dataset.conf),
           bbox:JSON.parse(c.dataset.bbox),verdict:'ok',ts:Date.now()};
  if(SINK){fetch(SINK+'/label',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(lbl)}).then(function(){btn.textContent='✓ 已確認（永不再壓）';
    btn.disabled=true;c.classList.add('done');}).catch(function(){btn.textContent='✗ 失敗,重試';});}
}
var STRONG=[{"id": "2026-05-30 CH01 16:36 | 0530_1636_CH01_2p0v.jpg", "cn": "CH01", "time": "16:36", "conf": 0.4, "bbox": [0.5559, 0.0785, 0.5855, 0.2111], "raw_url": "https://img.proxyforanding.xyz/d/1nuFboVylcCNWrf-g5OjDmqO4AFOoXpme", "mav": "PERSON", "gem": "PERSON", "votes": 2}],WEAK=[{"id": "2026-05-30 CH02 00:33 | 0530_0033_CH02_1p0v.jpg", "cn": "CH02", "time": "00:33", "conf": 0.49, "bbox": [0.6012, 0.3076, 0.6172, 0.3944], "raw_url": "https://img.proxyforanding.xyz/d/19WDejxGmsme5p-9MipppEEHiosiellEl", "mav": "PERSON", "gem": "NOPERSON", "votes": 1}, {"id": "2026-05-30 CH02 04:03 | 0530_0403_CH02_1p0v.jpg", "cn": "CH02", "time": "04:03", "conf": 0.47, "bbox": [0.602, 0.3069, 0.618, 0.3924], "raw_url": "https://img.proxyforanding.xyz/d/1LNel7kGkyPihKGXcPfMp8-Gu7L_KkdVg", "mav": "PERSON", "gem": "NOPERSON", "votes": 1}, {"id": "2026-05-30 CH02 19:20 | 0530_1920_CH02_1p1v.jpg", "cn": "CH02", "time": "19:20", "conf": 0.46, "bbox": [0.1895, 0.3646, 0.2219, 0.4736], "raw_url": "https://img.proxyforanding.xyz/d/1H7XLab6pJ9EEU2XR8lCe6ZSgjrYTHO8Z", "mav": "PERSON", "gem": "NOPERSON", "votes": 1}, {"id": "2026-05-30 CH05 21:14 | 0530_2114_CH05_2p0v.jpg", "cn": "CH05", "time": "21:14", "conf": 0.33, "bbox": [0.2105, 0.1986, 0.2359, 0.309], "raw_url": "https://img.proxyforanding.xyz/d/1zkMUixYMaXXL7rDrEf_MbAnAsZ6bBmLu", "mav": "PERSON", "gem": "NOPERSON", "votes": 1}];
function pct(v){return (v*100).toFixed(2)+'%';}
function makeCard(d){
  var b=d.bbox||[0,0,1,1];
  var card=document.createElement('div');card.className='card';
  card.dataset.id=d.id;card.dataset.conf=d.conf;card.dataset.bbox=JSON.stringify(b);
  var weak=d.votes<2?' weak':'';
  card.innerHTML='<div class=frame><img loading=lazy src="'+d.raw_url+'">'
    +'<div class=box style="left:'+pct(Math.min(b[0],b[2]))+';top:'+pct(Math.min(b[1],b[3]))
    +';width:'+pct(Math.abs(b[2]-b[0]))+';height:'+pct(Math.abs(b[3]-b[1]))+'"></div></div>'
    +'<div class=cap><span class=c>'+d.cn+' '+d.time+'</span> · conf '+d.conf
    +' <span class="vote'+weak+'">· mav:'+d.mav+' gemma:'+d.gem+' ('+d.votes+'/2 認為是人)</span></div>'
    +'<button onclick="confirmReal(this)">✓ 確認真人（永不再壓）</button>';
  return card;
}
function render(){
  var g=document.getElementById('grid');
  if(!STRONG.length){g.innerHTML='<div class=empty>✅ 這天沒有「兩模型都認為是人」的被埋真人。</div>';}
  else STRONG.forEach(function(d){g.appendChild(makeCard(d));});
  var w=document.getElementById('weak');
  WEAK.forEach(function(d){w.appendChild(makeCard(d));});
  if(!WEAK.length){document.getElementById('weakwrap').style.display='none';}
  else document.getElementById('weaksum').textContent='弱候選 '+WEAK.length+'（只有單一模型認為是人,實測這類多半不是人）— 點開複查';
}
render();
</script></html>
