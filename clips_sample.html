<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>移動事件預覽</title><style>
body{background:#14141e;color:#eee;font:15px sans-serif;margin:0;padding:14px}
h1{font-size:18px}.g{display:flex;flex-wrap:wrap;gap:14px}
.card{background:#1e1e2e;border-radius:8px;padding:8px;width:420px}
video{width:100%;border-radius:5px;display:block;background:#000}
.m{font-size:13px;color:#bbb;margin-top:6px}.tag{display:inline-block;background:#333;border-radius:4px;padding:1px 6px;margin:1px;font-size:12px}
</style></head><body>
<h1>滑鼠移到影片上 → 自動播放動態（移開停）。1280px 樣本。</h1>
<div class="g"><div class="card"><video muted loop preload="none" poster="clips/s0_CH01_arrival.jpg"><source src="clips/s0_CH01_arrival.mp4" type="video/mp4"></video><div class="m"><span class="tag">CH01</span><span class="tag">arrival</span><span class="tag">00:05:45</span><span class="tag">car</span><span class="tag">557.1KB</span></div></div>
<div class="card"><video muted loop preload="none" poster="clips/s1_CH01_moving.jpg"><source src="clips/s1_CH01_moving.mp4" type="video/mp4"></video><div class="m"><span class="tag">CH01</span><span class="tag">moving</span><span class="tag">05:23:00</span><span class="tag">person</span><span class="tag">333.3KB</span></div></div>
<div class="card"><video muted loop preload="none" poster="clips/s2_CH01_departure.jpg"><source src="clips/s2_CH01_departure.mp4" type="video/mp4"></video><div class="m"><span class="tag">CH01</span><span class="tag">departure</span><span class="tag">05:01:00</span><span class="tag">car</span><span class="tag">662.7KB</span></div></div>
<div class="card"><video muted loop preload="none" poster="clips/s3_CH01_moving.jpg"><source src="clips/s3_CH01_moving.mp4" type="video/mp4"></video><div class="m"><span class="tag">CH01</span><span class="tag">moving</span><span class="tag">04:53:00</span><span class="tag">truck</span><span class="tag">504.0KB</span></div></div></div>
<script>
document.querySelectorAll('video').forEach(function(v){
  v.addEventListener('mouseover',function(){v.play();});
  v.addEventListener('mouseout',function(){v.pause();v.currentTime=0;});
});
</script></body></html>
